$kind: http-request
order: 2000
method: POST
url: "{{base_url}}/api/auth/login"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "leobloise",
      "password": "leonardo03"
    }
examples: ./.resources/Login.resources/examples/
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const body = pm.response.json();
        pm.collectionVariables.set("access_token", body.accessToken);
      }
    language: text/javascript
