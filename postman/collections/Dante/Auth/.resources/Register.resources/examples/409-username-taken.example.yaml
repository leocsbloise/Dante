  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"message":"Some information needs to be corrected.","status":409,"operation_id":"4bf92f3577b34da6a3ce929d0e0e4736","data":{"username":"Username is already in use."}}
