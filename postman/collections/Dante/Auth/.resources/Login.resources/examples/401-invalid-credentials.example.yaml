$kind: http-example
name: 401 Invalid credentials
order: 2000
request:
  method: POST
  url: http://localhost:5259/api/auth/login
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"username":"ada","password":"wrong-password"}
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"error":"Invalid username or password."}
