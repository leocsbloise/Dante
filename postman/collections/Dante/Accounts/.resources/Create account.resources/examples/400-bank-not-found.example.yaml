$kind: http-example
name: 400 Bank not found
order: 2000
request:
  method: POST
  url: http://localhost:5259/api/accounts
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    content: |-
      {"bankId":"00000000-0000-0000-0000-000000000000","name":"Checking"}
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"message":"Some information needs to be corrected.","status":400,"operation_id":"4bf92f3577b34da6a3ce929d0e0e4736","data":{"bankId":"Bank was not found."}}
