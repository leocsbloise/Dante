$kind: http-example
name: 400 Same account
order: 2000
request:
  method: POST
  url: http://localhost:5259/api/ledger
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    content: |-
      {"debitAccountId":"11111111-1111-1111-1111-111111111111","creditAccountId":"11111111-1111-1111-1111-111111111111","amount":10.5,"occurredAt":"2026-03-15T22:30:00-03:00","timeZone":"America/Sao_Paulo"}
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"error":"The debit and credit accounts must be different."}
