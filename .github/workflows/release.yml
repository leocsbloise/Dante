name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read the version
        id: version
        env:
          RELEASE_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A release branch is named release/vX.Y.Z. This one is '$RELEASE_REF'."
            exit 1
          fi
          if [[ ! -f "RELEASE NOTES" ]]; then
            echo "The release branch needs a RELEASE NOTES file."
            exit 1
          fi
          echo "version=${RELEASE_REF#release/}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the server
        run: dotnet publish src/Dante.Server/Dante.Server.csproj --configuration Release --output publish

      - name: Pack the build
        run: zip -r "dante-${{ steps.version.outputs.version }}.zip" publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            "dante-${{ steps.version.outputs.version }}.zip" \
            --repo "${{ github.repository }}" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file "RELEASE NOTES"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: leobloise/dante:${{ steps.version.outputs.version }}
