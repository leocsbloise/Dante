openapi: 3.0.3
info:
  title: Dante
  version: 0.1.0
  description: |
    Personal finance API for Brazil. This document describes the HTTP surface
    implemented by Dante.Server. It was derived from the controllers, application
    contracts, and DomainExceptionHandler. Responses were not captured from a
    running server.

    Register and login are public. Every other route requires a bearer JWT issued
    by login. The token lifetime is one hour. Account reads and deletes are limited
    to the user id in the token subject.

    Every JSON body is an envelope: `message`, `status` (the same integer as the
    HTTP status), `operation_id` (the W3C trace id), and optional `data`.
    A successful resource, list, token, or page is in `data`. A field error puts
    a map of JSON field names to sentences in `data`, and `message` is
    "Some information needs to be corrected." A general error omits `data`.
    A missing or rejected bearer token is `401` with message "Sign in to continue."
    An unexpected failure is `500` with message "Something went wrong."
    Deleting an account is `200` with message "Account deleted." and no `data`.
servers:
  - url: http://localhost:5259
    description: Local development profile
tags:
  - name: Auth
  - name: Banks
  - name: Accounts
  - name: Ledger
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a user
      description: |
        Stores a PBKDF2 password hash. The username is unique without regard to case.
        There is no route that reads the user resource named in the Location header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            examples:
              valid:
                value:
                  username: ada
                  password: correct-horse
      responses:
        '201':
          description: User created.
          headers:
            Location:
              schema:
                type: string
              description: Path of the created user, `/api/users/{id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                username: ada
                createdAt: '2026-11-21T15:00:00+00:00'
        '400':
          description: Username or password failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                username:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      username: Username must be 3 to 32 characters and use letters, digits, dots, underscores, or hyphens.
                password:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      password: Password must be 8 to 128 characters.
        '409':
          description: Username is already in use, including a difference only in case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Some information needs to be corrected.
                status: 409
                operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                data:
                  username: Username is already in use.
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Issue an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              username: ada
              password: correct-horse
      responses:
        '200':
          description: Token issued. `expiresAt` is one hour after issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                expiresAt: '2026-11-21T16:00:00+00:00'
        '401':
          description: Unknown user, empty password, or password mismatch. The message does not say which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid username or password.
                status: 401
                operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
  /api/banks:
    get:
      tags: [Banks]
      operationId: listBanks
      summary: List banks
      description: Ordered by short name. The catalog is filled from BrasilAPI on startup and is not writable through this API.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bank catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bank'
              example:
                - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  ispb: '00000000'
                  code: 1
                  fullName: Banco do Brasil S.A.
                  shortName: BCO DO BRASIL S.A.
                  logoUrl: https://brasilapi.com.br/api/banks/v1/00000000/logo
        '401':
          description: Missing or rejected bearer token. Body shape was not captured from a live challenge.
  /api/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List the caller's accounts
      description: Ordered by account name. Another user's accounts are omitted.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts owned by the token subject.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
              example:
                - id: 11111111-1111-1111-1111-111111111111
                  name: Checking
                  bank:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    ispb: '00000000'
                    code: 1
                    fullName: Banco do Brasil S.A.
                    shortName: BCO DO BRASIL S.A.
                    logoUrl: null
        '401':
          description: Missing or rejected bearer token, or a token whose subject is not a user id. A bad subject uses the domain error body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid username or password.
                status: 401
                operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Open an account at a known bank
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
            example:
              bankId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              name: Checking
      responses:
        '201':
          description: Account created.
          headers:
            Location:
              schema:
                type: string
              description: `/api/accounts/{id}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Missing bank, unknown bank, or invalid account name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bankRequired:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      bankId: A bank is required.
                bankMissing:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      bankId: Bank was not found.
                name:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      name: Account name must be 1 to 80 characters.
        '401':
          description: Missing or rejected bearer token.
  /api/accounts/{id}:
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete an account owned by the caller
      description: An account that belongs to someone else is reported as not found.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Account deleted.
                status: 200
                operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '404':
          description: No account with this id belongs to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Account was not found.
                status: 404
                operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Missing or rejected bearer token.
  /api/ledger:
    get:
      tags: [Ledger]
      operationId: searchLedger
      summary: Search ledger entries
      description: |
        Returns the caller's entries. Debit account, credit account, and time window are optional.
        At least one is required. Each value that is present narrows the result.
        `from` and `to` are local times without an offset. `timeZone` converts them to UTC.
        `to` is exclusive. Pages are ordered by `occurredAt` only. `limit` defaults to 100 and cannot exceed it.
        Pass `cursor` only with the same filters that produced it. A changed filter is a new search.
      security:
        - bearerAuth: []
      parameters:
        - name: debitAccountId
          in: query
          schema:
            type: string
            format: uuid
        - name: creditAccountId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Local start, inclusive. A date means midnight.
          schema:
            type: string
            example: '2026-03-15T00:00:00'
        - name: to
          in: query
          description: Local end, exclusive.
          schema:
            type: string
            example: '2026-03-16T00:00:00'
        - name: timeZone
          in: query
          schema:
            type: string
            example: America/Sao_Paulo
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of entries. `nextCursor` is absent when the page is the last one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
              example:
                entries:
                  - id: 33333333-3333-3333-3333-333333333333
                    debitAccountId: 11111111-1111-1111-1111-111111111111
                    creditAccountId: 22222222-2222-2222-2222-222222222222
                    amount: 10.5
                    occurredAt: '2026-03-16T01:30:00+00:00'
                    timeZone: America/Sao_Paulo
                nextCursor: null
        '400':
          description: No filter, a limit outside 1 to 100, a window that cannot be converted, or a cursor from another search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                required:
                  value:
                    message: A debit account, a credit account, or a time window is required.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                window:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      from: The local time does not exist in this time zone.
                cursor:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      cursor: The cursor belongs to a different search.
        '404':
          description: A supplied account is missing or belongs to someone else.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Account was not found.
                status: 404
                operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Missing or rejected bearer token.
    post:
      tags: [Ledger]
      operationId: createLedgerEntry
      summary: Record a ledger entry
      description: |
        One balanced event between two bank accounts owned by the caller.
        The amount is greater than zero and has at most two decimal places.
        `occurredAt` is stored in UTC. `timeZone` is the IANA zone of the event, such as `America/Sao_Paulo`.
        There is no route for one entry by id. Search is `GET /api/ledger`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerEntry'
            example:
              debitAccountId: 11111111-1111-1111-1111-111111111111
              creditAccountId: 22222222-2222-2222-2222-222222222222
              amount: 10.5
              occurredAt: '2026-03-15T22:30:00-03:00'
              timeZone: America/Sao_Paulo
      responses:
        '201':
          description: Entry recorded.
          headers:
            Location:
              schema:
                type: string
              description: `/api/ledger/{id}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
              example:
                id: 33333333-3333-3333-3333-333333333333
                debitAccountId: 11111111-1111-1111-1111-111111111111
                creditAccountId: 22222222-2222-2222-2222-222222222222
                amount: 10.5
                occurredAt: '2026-03-16T01:30:00+00:00'
                timeZone: America/Sao_Paulo
        '400':
          description: The accounts are the same, the amount is not a positive amount of cents, the time is missing, or the time zone is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                accounts:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      debitAccountId: The debit and credit accounts must be different.
                      creditAccountId: The debit and credit accounts must be different.
                amount:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      amount: Amount must be greater than zero.
                cents:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      amount: Amount must have at most two decimal places.
                timeZone:
                  value:
                    message: Some information needs to be corrected.
                    status: 400
                    operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    data:
                      timeZone: Time zone was not recognized.
        '404':
          description: One of the accounts is missing or belongs to someone else.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Account was not found.
                status: 404
                operation_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Missing or rejected bearer token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9._-]{3,32}$'
        password:
          type: string
          minLength: 8
          maxLength: 128
    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
    Login:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    Bank:
      type: object
      required: [id, ispb, fullName, shortName]
      properties:
        id:
          type: string
          format: uuid
        ispb:
          type: string
          minLength: 8
          maxLength: 8
        code:
          type: integer
          nullable: true
          description: COMPE code. Absent from the source when the bank has none.
        fullName:
          type: string
        shortName:
          type: string
        logoUrl:
          type: string
          nullable: true
    Account:
      type: object
      required: [id, name, bank]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        bank:
          $ref: '#/components/schemas/Bank'
    CreateAccount:
      type: object
      required: [bankId, name]
      properties:
        bankId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          nullable: true
    CreateLedgerEntry:
      type: object
      required: [debitAccountId, creditAccountId, amount, occurredAt, timeZone]
      properties:
        debitAccountId:
          type: string
          format: uuid
          nullable: true
        creditAccountId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          nullable: true
          multipleOf: 0.01
          exclusiveMinimum: 0
        occurredAt:
          type: string
          format: date-time
          nullable: true
        timeZone:
          type: string
          maxLength: 64
          nullable: true
    LedgerEntry:
      type: object
      required: [id, debitAccountId, creditAccountId, amount, occurredAt, timeZone]
      properties:
        id:
          type: string
          format: uuid
        debitAccountId:
          type: string
          format: uuid
        creditAccountId:
          type: string
          format: uuid
        amount:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
        occurredAt:
          type: string
          format: date-time
        timeZone:
          type: string
    LedgerPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        nextCursor:
          type: string
          nullable: true
    Error:
      type: object
      required: [message, status, operation_id]
      properties:
        message:
          type: string
        status:
          type: integer
        operation_id:
          type: string
          description: W3C trace id of the request span.
        data:
          type: object
          additionalProperties:
            type: string
          description: Present for a field error. Each key is a request field.
